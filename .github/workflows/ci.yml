# CI gate for cordis-rs.
#
# Every job below is a gate: any failing step fails the workflow.
#
# Branch protection is a deployment-time repository setting and is NOT
# configured from this repository. When protected branches are enabled later
# (Settings -> Branches -> Require status checks to pass before merging),
# attach these check names generated by this workflow:
#
#     fmt
#     clippy-test (ubuntu-latest, stable)
#     clippy-test (ubuntu-latest, 1.85.0)
#     clippy-test (macos-latest, stable)
#     clippy-test (macos-latest, 1.85.0)
#     clippy-test (windows-latest, stable)
#     clippy-test (windows-latest, 1.85.0)
#
# Longer-running validation (full test suite repeated 3x, doc build, and
# cargo-llvm-cov coverage) lives in .github/workflows/integration.yml.
#
# Third-party actions are pinned to major version tags and updated through
# Dependabot (.github/dependabot.yml).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deduplicate runs per ref. Superseded PR runs are cancelled; runs on main
# always run to completion so the gate status of the default branch is a
# complete record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `cargo fmt --check` output is platform- and toolchain-independent, so it
  # runs once on Linux stable instead of in every matrix cell.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Explicit override so the gate never depends on rust-toolchain.toml
      # resolution inside the runner image.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
        timeout-minutes: 10

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 5

  # Platform x toolchain gate matrix: clippy with warnings denied, then the
  # full workspace test suite. Ubuntu is the required platform; macOS and
  # Windows cells surface path, shell and platform differences early.
  clippy-test:
    name: clippy-test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every failing cell, not only the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # MSRV cell: keep "1.85.0" in sync with `rust-version` in the root
        # Cargo.toml, `msrv` in clippy.toml, and the policy comment in
        # rust-toolchain.toml.
        toolchain: [stable, "1.85.0"]
    env:
      # rust-toolchain.toml pins `stable`; the environment variable takes
      # precedence over the toolchain file, which is what makes the MSRV
      # cells actually build with 1.85.0.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
        timeout-minutes: 10

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 10

      - name: Lint with clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 20

      - name: Run workspace tests
        run: cargo test --workspace --locked
        timeout-minutes: 20
