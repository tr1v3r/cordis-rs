# Dependabot updates for cordis-rs.
#
# - github-actions: keeps the pinned major tags in .github/workflows/ current.
# - cargo: keeps Cargo.lock / manifest dependencies current while the
#   workspace still has no external dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
