[package]
name = "cordis-core"
description = "Kernel of cordis-rs: coordinator, effect bindings and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# cordis-core deliberately keeps its dependency surface minimal (no serde,
# wasmtime or notify; see AGENTS.md boundaries). Tokio is the one runtime
# substrate the design locks in (docs/08-decisions.md D01/D03): the
# coordinator's bounded mailboxes, supervised workers and JoinHandle
# semantics are specified against it. Only the executor-facing features are
# enabled — no I/O driver, no network stack. Exact versions are pinned by
# the workspace Cargo.lock (docs/08-decisions.md, "lock actual versions").
[dependencies]
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "sync",
    "time",
    "macros",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# Tests exercise the coordinator on both scheduler flavors required by
# docs/07-validation.md §8 (current_thread and multi_thread).
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }

[lints]
workspace = true

[features]
tracing = ["dep:tracing"]

# Runnable examples live in the workspace-level `examples/` directory
# (README links them there); each is started with
# `cargo run --example <name> -p cordis-core`.
[[example]]
name = "fibers"
path = "../../examples/fibers.rs"

[[example]]
name = "services"
path = "../../examples/services.rs"

[[example]]
name = "events"
path = "../../examples/events.rs"
