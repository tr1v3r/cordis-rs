# Toolchain policy for cordis-rs.
#
# - Development and CI build on stable Rust. This file pins `stable` (resolved
#   to the newest installed stable toolchain; scaffold verified with 1.98.1).
# - Workspace MSRV is 1.85, the first stable release supporting edition 2024,
#   mirrored by `rust-version` in the root Cargo.toml and `msrv` in
#   clippy.toml, and enforced by a dedicated CI job.
# - This file intentionally does NOT pin 1.85 so contributors keep building on
#   current stable; MSRV compatibility is proven in CI instead.
[toolchain]
channel = "stable"
profile = "minimal"
components = ["rustfmt", "clippy"]
